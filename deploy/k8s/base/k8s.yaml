# Kubernetes Base Configuration

# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: short-video-insight
  labels:
    app.kubernetes.io/name: short-video-insight
    app.kubernetes.io/part-of: short-video-insight

---
# ConfigMap for shared configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: short-video-config
  namespace: short-video-insight
data:
  DATABASE_URL: "postgresql+asyncpg://postgres:5432/short_video_insight"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  ELASTICSEARCH_HOST: "elasticsearch"
  ELASTICSEARCH_PORT: "9200"

---
# Secrets (Note: In production, use external secret management)
apiVersion: v1
kind: Secret
metadata:
  name: short-video-secrets
  namespace: short-video-insight
type: Opaque
stringData:
  POSTGRES_PASSWORD: "postgres"
  JWT_SECRET: "your-secret-key-change-in-production"
  DEEPSEEK_API_KEY: ""
  OPENAI_API_KEY: ""

---
# PostgreSQL Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: short-video-insight
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: POSTGRES_DB
              value: short_video_insight
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc

---
# PostgreSQL Service
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: short-video-insight
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres

---
# Redis Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: short-video-insight
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379

---
# Redis Service
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: short-video-insight
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: redis

---
# Elasticsearch Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: short-video-insight
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
          ports:
            - containerPort: 9200
          env:
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "false"

---
# Elasticsearch Service
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: short-video-insight
spec:
  ports:
    - port: 9200
      targetPort: 9200
  selector:
    app: elasticsearch
