# Short Video Insight Platform - Docker Compose
# docker compose -f deploy/docker/docker-compose.yml build
# docker compose -f deploy/docker/docker-compose.yml up -d
# docker exec -it short-video-nginx /bin/sh
# docker compose -f deploy/docker/docker-compose.yml restart nginx

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: short-video-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: short_video_insight
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  # Redis
  redis:
    image: redis:7-alpine
    container_name: short-video-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  # Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: short-video-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - default

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: short-video-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  # User Service
  user-service:
    build:
      context: ../../services/user-service
      dockerfile: Dockerfile
    container_name: short-video-user-service
    restart: unless-stopped
    expose:
      - "8001"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/short_video_insight
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    develop:
      watch:
        - action: sync
          path: ../../services/user-service
          target: /app
          ignore:
            - __pycache__/
            - .pytest_cache/
            - .git/
            - .venv/
            - venv/
            - .idea/
            - .vscode/
        - action: rebuild
          path: ../../services/user-service/requirements.txt
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default

  # Video Service
  video-service:
    build:
      context: ../../services/video-service
      dockerfile: Dockerfile
    container_name: short-video-video-service
    restart: unless-stopped
    expose:
      - "8002"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/short_video_insight
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
    volumes:
      - ../../cookies:/app/cookies
      - ../../.env:/app/env/.env
    develop:
      watch:
        - action: sync
          path: ../../services/video-service
          target: /app
          ignore:
            - __pycache__/
            - .pytest_cache/
            - .git/
            - .venv/
            - venv/
            - .idea/
            - .vscode/
        - action: rebuild
          path: ../../services/video-service/requirements.txt
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - default

  # Insight Service
  insight-service:
    build:
      context: ../../services/insight-generator
      dockerfile: Dockerfile
    container_name: short-video-insight-service
    restart: unless-stopped
    expose:
      - "8003"
    volumes:
      - ../../.env:/app/env/.env
    develop:
      watch:
        - action: sync
          path: ../../services/insight-generator
          target: /app
          ignore:
            - __pycache__/
            - .pytest_cache/
            - .git/
            - .venv/
            - venv/
            - .idea/
            - .vscode/
        - action: rebuild
          path: ../../services/insight-generator/requirements.txt
    environment:
      - AI_PROVIDER=deepseek
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/short_video_insight
    networks:
      - default

  # Data Collector Service
  data-collector:
    build:
      context: ../../services/data-collector
      dockerfile: Dockerfile
    container_name: short-video-data-collector
    restart: unless-stopped
    expose:
      - "8004"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/short_video_insight
      - REDIS_HOST=short-video-redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=short-video-rabbitmq
      - CELERY_BROKER_URL=redis://short-video-redis:6379/0
      - CELERY_RESULT_BACKEND=redis://short-video-redis:6379/0
      - TZ=Asia/Shanghai
    volumes:
      - ../../cookies:/app/cookies
      - ../../.env:/app/env/.env
    develop:
      watch:
        - action: sync
          path: ../../services/data-collector
          target: /app
          ignore:
            - __pycache__/
            - .pytest_cache/
            - .git/
            - .venv/
            - venv/
            - .idea/
            - .vscode/
        - action: rebuild
          path: ../../services/data-collector/requirements.txt
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default

  # Competitor Monitor Service
  competitor-monitor:
    build:
      context: ../../services/competitor-monitor
      dockerfile: Dockerfile
    container_name: short-video-competitor-monitor
    restart: unless-stopped
    expose:
      - "8005"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/short_video_insight
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ../../.env:/app/env/.env
    develop:
      watch:
        - action: sync
          path: ../../services/competitor-monitor
          target: /app
          ignore:
            - __pycache__/
            - .pytest_cache/
            - .git/
            - .venv/
            - venv/
            - .idea/
            - .vscode/
        - action: rebuild
          path: ../../services/competitor-monitor/requirements.txt
    networks:
      - default

  # Report Service
  report-service:
    build:
      context: ../../services/report-service
      dockerfile: Dockerfile
    container_name: short-video-report-service
    restart: unless-stopped
    expose:
      - "8006"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/short_video_insight
    volumes:
      - ../../.env:/app/env/.env
    develop:
      watch:
        - action: sync
          path: ../../services/report-service
          target: /app
          ignore:
            - __pycache__/
            - .pytest_cache/
            - .git/
            - .venv/
            - venv/
            - .idea/
            - .vscode/
        - action: rebuild
          path: ../../services/report-service/requirements.txt
    networks:
      - default

  # Frontend
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: short-video-frontend
    restart: unless-stopped
    expose:
      - "80"
    develop:
      watch:
        - action: sync
          path: ../../frontend/src
          target: /app/src
          ignore:
            - node_modules/
        - action: sync
          path: ../../frontend/public
          target: /app/public
          ignore:
            - node_modules/
        - action: sync+restart
          path: ../../frontend/vite.config.ts
          target: /app/vite.config.ts
        - action: sync+restart
          path: ../../frontend/index.html
          target: /app/index.html
        - action: rebuild
          path: ../../frontend/package.json
        - action: rebuild
          path: ../../frontend/yarn.lock
        - action: rebuild
          path: ../../frontend/package-lock.json
    depends_on:
      - user-service
      - video-service
    networks:
      - default

  # Nginx Reverse Proxy（新增）
  nginx:
    image: nginx:alpine
    container_name: short-video-nginx
    restart: unless-stopped
    ports:
      - "80:80"      # HTTP 统一入口
      - "443:443"    # HTTPS 预留
    volumes:
      # 挂载 Nginx 配置文件
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # 可选：挂载 SSL 证书（如需 HTTPS）
      # - ./nginx/ssl:/etc/nginx/ssl:ro
      # 可选：挂载日志目录
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - user-service
      - video-service
      - insight-service
      - data-collector
      - competitor-monitor
      - report-service
      - frontend
    networks:
      - default

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  elasticsearch_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  default:
    name: short-video-network
    driver: bridge